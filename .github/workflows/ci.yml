name: CI

on:
  push:
    branches: [main, feature/shared-instrument-session]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Recreate locked development environment
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Non-hardware tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: uv run pytest -q -ra -m "not hardware"
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: labtools-windows-distributions
          path: dist/*
          if-no-files-found: error
